name: Terraform CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-plan:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_token: ${{ secrets.GH_TOKEN_PUBLISH }}
      TF_VAR_github_owner: "petrolal"
      TF_VAR_maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      TF_VAR_maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      TF_VAR_signing_password: ${{ secrets.SIGNING_PASSWORD }}
      TF_VAR_signing_key: ${{ secrets.SIGNING_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

  apply:
    name: Terraform Apply
    needs: validate-and-plan
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_token: ${{ secrets.GH_TOKEN_PUBLISH }}
      TF_VAR_github_owner: "petrolal"
      TF_VAR_maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      TF_VAR_maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      TF_VAR_signing_password: ${{ secrets.SIGNING_PASSWORD }}
      TF_VAR_signing_key: ${{ secrets.SIGNING_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
